[project]
name = "duideshang-api"
version = "0.1.0"
description = "Requirement clarification and transparent quotation agent demo"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
